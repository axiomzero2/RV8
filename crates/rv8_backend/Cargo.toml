# CEP:FILE: crates/rv8_backend/Cargo.toml
# CEP:WHAT: Manifest for rv8_backend, the transition-6.4 pipeline (isel, MCF regalloc,
#   rewrite, schedule, verify, encode) plus the in-process JIT execution path (RV8-141).
# CEP:WHY: STANDARDS 5.13 names rv8_backend a home of the JIT hybrid: src/jit.rs (the
#   emitter's instruction path) compiles LIR through the AOT oracle and resolves
#   relocations into rv8_runtime::jitmem W^X memory, so the runtime is a real
#   dependency of the compiler-side JIT tier. The runtime stays out of the object path:
#   the driver's --emit obj/run pipeline never touches jitmem, and pure-AOT output is
#   byte-identical with the JIT disabled (pinned by the jit tests).
# CEP:CLASS: HPC-1
# CEP:STATUS: complete
# CEP:OWNER: axiomzero2
# CEP:TICKET: RV8-100
# CEP:FAILURE: none
# CEP:ASSUMES: zero external crates (first-party workspace paths only).
# CEP:COST: cold.
# CEP:EVIDENCE: workspace build and the full gate set over this crate.
[package]
name = "rv8_backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rv8_isl = { path = "../rv8_isl" }
rv8_core = { workspace = true }
rv8_ir = { workspace = true }
rv8_middle = { workspace = true }
rv8_runtime = { path = "../rv8_runtime" }
